<!-- Top Header -->
<header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-30 backdrop-blur">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-lg text-white tracking-tight">ALpanel</span>
          <span id="live-indicator" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> EN VIVO
          </span>
          <span id="current-user-badge" class="hidden inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] bg-slate-950 border border-slate-800"></span>
        </div>
        <div class="text-xs text-slate-400 flex items-center gap-3">
          <span><i class="fa-solid fa-network-wired mr-1 text-indigo-400"></i>IP: <strong id="host-ip" class="text-slate-200 cursor-pointer hover:text-indigo-400" onclick="copyText(this.innerText, 'IP del servidor copiada')">...</strong></span>
          <span class="hidden sm:inline">•</span>
          <span class="hidden sm:inline" id="host-os">Linux VPS</span>
          <span class="hidden sm:inline">•</span>
          <span id="host-uptime">Uptime: ...</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <button id="btn-top-clone" onclick="openCloneModal()" class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nuevo Proyecto (Git)</span><span class="sm:hidden">Nuevo</span>
      </button>
      <button id="btn-top-prune" onclick="pruneServerDocker()" class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 text-xs font-semibold transition flex items-center gap-1.5" title="Liberar espacio limpiando imágenes huérfanas y caché de compilación Docker">
        <i class="fa-solid fa-broom"></i> <span class="hidden sm:inline">Limpiar Caché Docker</span><span class="sm:hidden">Caché</span>
      </button>
      <button onclick="refreshAll()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs transition" title="Refrescar ahora">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <button onclick="logout()" class="p-2 rounded-xl bg-slate-800 hover:bg-rose-950/60 text-rose-400 border border-slate-700 text-xs transition" title="Cerrar sesión">
        <i class="fa-solid fa-power-off"></i>
      </button>
    </div>
  </div>

  <!-- Navigation Tabs -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 flex overflow-x-auto whitespace-nowrap gap-4 sm:gap-6 text-xs sm:text-sm border-t border-slate-800/60">
    <button onclick="switchTab('projects')" id="tab-btn-projects" class="py-2.5 sm:py-3 border-b-2 border-indigo-500 text-indigo-400 font-semibold flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-layer-group"></i> <span>Proyectos</span><span class="hidden sm:inline">& Contenedores</span>
    </button>
    <button onclick="switchTab('domains')" id="tab-btn-domains" class="py-2.5 sm:py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-medium flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-globe"></i> <span>Dominios SSL</span>
    </button>
    <button onclick="switchTab('guide')" id="tab-btn-guide" class="py-2.5 sm:py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-medium flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-book-open"></i> <span>Guía Multi-Stack</span>
    </button>
    <button onclick="switchTab('users')" id="tab-btn-users" class="py-2.5 sm:py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-medium flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-users-gear"></i> <span>Usuarios & Roles</span>
    </button>
    <button onclick="switchTab('permissions')" id="tab-btn-permissions" class="py-2.5 sm:py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-medium flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-user-shield"></i> <span>Permisos & Servicios</span>
    </button>
    <button onclick="switchTab('audit')" id="tab-btn-audit" class="py-2.5 sm:py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-medium flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-shield-halved"></i> <span>Auditoría</span>
    </button>
  </div>
</header>

<!-- Main Content Container -->
<main class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-4 sm:py-6 flex-1 space-y-5">
  <!-- Global Server Resource Strip -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 sm:gap-4">
    <div class="flex items-center gap-3 bg-slate-900/90 border border-slate-800/80 rounded-xl px-3.5 py-2">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-microchip"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between text-xs mb-1">
          <span class="text-slate-400 font-medium">CPU Servidor <span id="cpu-cores" class="text-slate-500"></span></span>
          <span id="cpu-percent" class="font-bold text-white">0%</span>
        </div>
        <div class="w-full h-1.5 sm:h-2 bg-slate-800 rounded-full overflow-hidden">
          <div id="cpu-bar" class="h-full bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3 bg-slate-900/90 border border-slate-800/80 rounded-xl px-3.5 py-2">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-memory"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between text-xs mb-1">
          <span class="text-slate-400 font-medium">Memoria RAM</span>
          <span id="ram-text" class="font-bold text-white">0 MB / 0 GB</span>
        </div>
        <div class="w-full h-1.5 sm:h-2 bg-slate-800 rounded-full overflow-hidden">
          <div id="ram-bar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3 bg-slate-900/90 border border-slate-800/80 rounded-xl px-3.5 py-2">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-hard-drive"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between text-xs mb-1">
          <span class="text-slate-400 font-medium">Disco SSD</span>
          <span id="disk-text" class="font-bold text-white">0 GB / 0 GB</span>
        </div>
        <div class="w-full h-1.5 sm:h-2 bg-slate-800 rounded-full overflow-hidden">
          <div id="disk-bar" class="h-full bg-amber-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedores de Vistas de cada Módulo -->
  <section id="tab-projects" class="space-y-5"></section>
  <section id="tab-domains" class="hidden space-y-6"></section>
  <section id="tab-guide" class="hidden space-y-6"></section>
  <section id="tab-users" class="hidden space-y-6"></section>
  <section id="tab-permissions" class="hidden space-y-6"></section>
  <section id="tab-audit" class="hidden space-y-4"></section>
</main>
