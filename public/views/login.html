<div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur">
  <div class="flex items-center gap-3 mb-6">
    <div class="w-12 h-12 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-2xl">
      <i class="fa-solid fa-bolt"></i>
    </div>
    <div>
      <h1 class="text-xl font-bold text-white">ALpanel</h1>
      <p class="text-xs text-slate-400">Orquestador Modular • Prisma ORM & MariaDB 11</p>
    </div>
  </div>

  <form id="login-form" onsubmit="submitLoginForm(event)" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Usuario</label>
      <input type="text" id="login-user" value="superadmin" required
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••••••" required
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" />
    </div>
    <div id="login-error" class="hidden text-xs text-rose-400 bg-rose-950/50 border border-rose-800 rounded-lg p-3"></div>
    <button type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/25">
      <i class="fa-solid fa-right-to-bracket mr-2"></i> Ingresar a ALpanel
    </button>
  </form>
</div>
