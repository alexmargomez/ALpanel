<div id="domains-create-box" class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
  <h3 class="text-base font-bold text-white mb-1">
    <i class="fa-solid fa-shield-halved text-emerald-400 mr-2"></i>Enrutador de Dominios y Subdominios (Caddy HTTPS + Prisma ORM)
  </h3>
  <p class="text-xs text-slate-400 mb-4">
    Conecta un dominio o subdominio al contenedor Frontend de tu proyecto, y opcionalmente enruta <code class="text-indigo-400">/api/*</code> hacia su contenedor Backend sin conflictos de CORS ni puertos.
  </p>

  <form id="domain-form" class="space-y-3">
    <div class="grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">Proyecto Relacionado</label>
        <select id="dom-project" onchange="onDomainProjectSelectChange()" required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
          <option value="">Selecciona un proyecto...</option>
        </select>
      </div>
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">Dominio / Subdominio</label>
        <input type="text" id="dom-domain" placeholder="ej. zapatoqueando.tudominio.com" required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">Contenedor Principal / Front (host:puerto)</label>
        <input type="text" id="dom-front" placeholder="zapatoqueando-server:3000" required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-300 font-mono focus:outline-none focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">Backend Opcional en /api/* (host:puerto)</label>
        <input type="text" id="dom-back" placeholder="mi_backend:8080 (opcional)"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-indigo-300 font-mono focus:outline-none focus:border-indigo-500" />
      </div>
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-4 rounded-xl text-xs transition shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-plus mr-1"></i> Guardar Ruta SSL
      </button>
    </div>

    <!-- Contenedores detectados automáticamente del proyecto seleccionado -->
    <div id="dom-project-containers-hint" class="hidden bg-slate-950/80 border border-slate-800/80 rounded-xl px-3.5 py-2.5 text-xs flex flex-wrap items-center gap-2"></div>
  </form>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
    <h4 class="text-sm font-bold text-white mb-3">Dominios Configurados en MariaDB</h4>
    <div id="domains-list" class="space-y-3"></div>
  </div>
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
    <div class="flex items-center justify-between mb-3">
      <h4 class="text-sm font-bold text-white">Caddyfile Generado</h4>
      <button onclick="copyText(document.getElementById('caddyfile-preview').innerText, 'Caddyfile copiado')" class="text-xs text-indigo-400 hover:underline">
        <i class="fa-regular fa-copy mr-1"></i>Copiar
      </button>
    </div>
    <pre id="caddyfile-preview" class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-emerald-300 font-mono overflow-x-auto max-h-80"></pre>
  </div>
</div>
