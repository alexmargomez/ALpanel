<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <!-- Left / Main: Users Table (2 cols) -->
  <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-400"></i> Usuarios del Panel
        </h3>
        <p class="text-xs text-slate-400">
          Gestionados con <strong class="text-indigo-300">Prisma ORM</strong> en MariaDB 11 • Hash <code class="text-emerald-400">scrypt + salt</code>.
        </p>
      </div>
      <button id="btn-new-user" onclick="openUserModal()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-md shadow-indigo-600/20">
        <i class="fa-solid fa-user-plus"></i> Nuevo Usuario
      </button>
    </div>

    <div id="users-list" class="space-y-2.5 text-xs"></div>
  </div>

  <!-- Right: Roles & RBAC Permissions Matrix (1 col) -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-id-badge text-amber-400"></i> Roles y Permisos RBAC
        </h3>
        <p class="text-xs text-slate-400">Define qué módulos y acciones puede usar cada rol.</p>
      </div>
      <button id="btn-new-role" onclick="openRoleModal()" class="px-3 py-2 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 text-xs font-semibold transition flex items-center gap-1.5">
        <i class="fa-solid fa-plus"></i> Nuevo Rol
      </button>
    </div>

    <div id="roles-list" class="space-y-2.5 text-xs"></div>
  </div>
</div>
