<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALpanel</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235850EC'/%3E%3Cpath d='M36.5 14L19 36h13l-2.5 14L47 28H34l2.5-14z' fill='%23FFFFFF' stroke='%23FFFFFF' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/panel.css" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            panel: {
              bg: '#0B0F19',
              card: '#111827',
              border: '#1F2937',
              accent: '#6366F1',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Contenedor del Módulo Login (/views/login.html) -->
  <div id="login-view" class="hidden min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950"></div>

  <!-- Contenedor del Módulo Página Principal / Dashboard (/views/dashboard.html) -->
  <div id="app-view" class="hidden flex-1 flex flex-col"></div>

  <!-- Contenedor de Modales del Sistema (/views/modals.html) -->
  <div id="modals-container"></div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-indigo-600 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-msg">Listo</span>
  </div>

  <!-- Módulos Frontend por Capas -->
  <script src="/js/modules/auth.js"></script>
  <script src="/js/modules/dashboard.js"></script>
  <script src="/js/modules/projects.js"></script>
  <script src="/js/modules/git.js"></script>
  <script src="/js/modules/domains.js"></script>
  <script src="/js/modules/users.js"></script>
  <script src="/js/modules/permissions.js"></script>
  <script src="/js/modules/security.js"></script>
  <script src="/js/core.js"></script>
</body>
</html>
