<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALpanel</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235850EC'/%3E%3Cpath d='M36.5 14L19 36h13l-2.5 14L47 28H34l2.5-14z' fill='%23FFFFFF' stroke='%23FFFFFF' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/panel.css" />
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('alpanel_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.add('light-mode');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.remove('light-mode');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            panel: {
              bg: '#0B0F19',
              card: '#111827',
              border: '#1F2937',
              accent: '#6366F1',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Punto de montaje de la SPA Vue 3 + TypeScript -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Bundle compilado por Vite (Vue 3 + TypeScript) -->
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
